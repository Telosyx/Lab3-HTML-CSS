<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід до кабінету</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Playfair+Display:wght@400;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <nav id="nav">
        <a href="./index.html">Повернутися на Головну</a>
    </nav>

    <main class="form-page">
        <section>
            <h1>Вхід для туристів</h1>
            <form action="#">
                <label for="login-email">Електронна пошта:</label>
                <input type="email" id="login-email" name="email" placeholder="mail@example.com" required>
                <br>
                
                <label for="login-password">Пароль (мінімум 8 символів):</label>
                <input type="password" id="login-password" name="password" minlength="8" required>
                <br>

                <button type="submit">Увійти</button>
                <button type="reset">Очистити</button>
            </form>
        </section>

        <hr>

        <section>
            <h1>Новий користувач (Реєстрація)</h1>
            <form action="#">
                <label for="reg-email">Електронна пошта:</label>
                <input type="email" id="reg-email" name="email" placeholder="mail@example.com" required>
                <br>

                <label for="reg-password">Створіть пароль:</label>
                <input type="password" id="reg-password" name="password" minlength="8" required>
                <br>
                
                <label for="reg-password-repeat">Повторіть пароль:</label>
                <input type="password" id="reg-password-repeat" name="password_repeat" minlength="8" required>
                <br>

                <button type="submit">Зареєструватися</button>
                <button type="reset">Очистити</button>
            </form>
        </section>
    </main>
    <a href="#nav" class="to-top" aria-label="Нагору"></a>
</body>
</html>
